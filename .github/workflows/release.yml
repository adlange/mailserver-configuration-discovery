name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Check that the tag matches the project version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(./mvnw --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::tag version $TAG_VERSION does not match pom version $POM_VERSION"
            exit 1
          fi
          case "$POM_VERSION" in
            *-SNAPSHOT)
              echo "::error::refusing to release snapshot version $POM_VERSION"
              exit 1
              ;;
          esac
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p target
          awk -v version="$VERSION" '
          $0 == "## " version { found = 1; next }
          /^## / { found = 0 }
          found { print }
          ' CHANGELOG.md > target/release-notes.md
          if ! grep -q '[^[:space:]]' target/release-notes.md; then
            echo "::error::CHANGELOG.md contains no section '## $VERSION'"
            exit 1
          fi
          cat >> target/release-notes.md <<EOF

          ---

          Grab the new version from [Maven Central](https://central.sonatype.com/artifact/de.adrianlange/mailserver-configuration-discovery/$VERSION) by using it in your dependencies:

          \`\`\`xml
          <dependency>
            <groupId>de.adrianlange</groupId>
            <artifactId>mailserver-configuration-discovery</artifactId>
            <version>$VERSION</version>
          </dependency>
          \`\`\`

          Or using Gradle:

          \`\`\`groovy
          implementation( 'de.adrianlange:mailserver-configuration-discovery:$VERSION' )
          \`\`\`
          EOF
      - name: Deploy to the Central Portal
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Create GitHub release
        # third-party action, pinned to a commit. Dependabot proposes SHA bumps
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: target/release-notes.md
          files: target/*.jar
