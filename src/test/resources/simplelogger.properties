# Logging configuration for tests (slf4j-simple). The library logs why a lookup returned nothing on DEBUG level,
# which is essential to understand failures of the live integration tests in MailserverConfigurationDiscoveryTest.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.de.adrianlange.mcd=debug
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
